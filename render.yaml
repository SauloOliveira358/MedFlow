services:
  - type: web
    name: medflow-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: ohio
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8080
      - key: CORS_ALLOWED_ORIGINS
        value: https://med-flow-4599a.web.app,https://med-flow-4599a.firebaseapp.com,http://localhost:5173,http://localhost:4200
