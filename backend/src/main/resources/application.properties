spring.application.name=MedFlow
spring.config.import=optional:file:./.env[.properties],optional:file:./backend/.env[.properties]

# Servidor
server.port=${SERVER_PORT:8085}

# Conexão PostgreSQL / Supabase
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-0-us-east-2.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${DB_USERNAME:postgres.flkuhlrsocmyjvepxiij}
spring.datasource.password=${DB_PASSWORD:@MedFlow358}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool (otimizado para Supabase Pooler)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Springdoc OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

medflow.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://localhost:4200,http://127.0.0.1:4200}
